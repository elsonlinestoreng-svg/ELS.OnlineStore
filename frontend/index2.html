<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELS.OnlineStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/els2.css">
</head>
<body class="h-full">
  <div id="app" class="h-full w-full overflow-auto" style="background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.78), rgba(30, 27, 75, 0.78)), url('images/Ecommerceimg.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat;">
    <div id="auth-screen" class="h-full w-full flex items-center justify-center">
      <div class="w-full max-w-md mx-4 fade-in">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-bold text-white" style="font-family:'Playfair Display',serif;">Welcome to JovA Marketplace</h1>
          <p class="text-gray-300 mt-1 text-sm">Shop with confidence, sell with ease.</p>
        </div>
        <div class="flex mb-6 rounded-xl overflow-hidden" style="background:rgba(255,255,255,0.05);">
          <button onclick="switchAuthTab('login')" class="flex-1 py-3 text-sm font-semibold text-white">Login</button>
          <button onclick="switchAuthTab('register')" class="flex-1 py-3 text-sm font-semibold text-gray-400">Register</button>
        </div>
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
          <input id="login-email" type="email" required placeholder="Email" class="w-full px-4 py-3 rounded-xl bg-white/10 text-white border border-white/20">
          <input id="login-pass" type="password" required placeholder="Password" class="w-full px-4 py-3 rounded-xl bg-white/10 text-white border border-white/20">
          <button type="submit" class="w-full py-3 rounded-xl font-semibold text-white" style="background:#e94560;">Sign In</button>
        </form>
      </div>
    </div>

    <div id="main-app" class="hidden h-full w-full">
      <header id="topnav" class="sticky top-0 z-30 w-full" style="background:#547f97;">
        <div class="flex items-center justify-between px-4 py-3">
          <h1 class="text-lg font-bold text-white" style="font-family:'Playfair Display',serif;">ELS.OnlineStore</h1>
          <nav class="flex items-center gap-2">
            <button onclick="goTo('shop')" class="text-white px-3 py-2 rounded-lg text-sm">Shop</button>
            <button onclick="goTo('cart')" class="text-white px-3 py-2 rounded-lg text-sm">Cart</button>
            <button onclick="goTo('payment')" class="text-white px-3 py-2 rounded-lg text-sm">Payment</button>
          </nav>
        </div>
      </header>

      <section id="page-payment" class="page bg-slate-50 min-h-screen py-12 px-4">
        <div class="max-w-2xl mx-auto">
          <h2 class="text-3xl font-bold text-slate-900 mb-8">Secure Checkout</h2>

          <!-- Shipping Address -->
          <div class="bg-white rounded-3xl p-6 shadow-sm mb-8">
            <h3 class="font-semibold text-lg mb-4">Shipping Address</h3>
            <div class="grid grid-cols-1 gap-4">
              <input id="shipping-street" type="text" placeholder="Street Address" class="w-full px-4 py-3 rounded-xl border border-slate-200">
              <div class="grid grid-cols-2 gap-4">
                <input id="shipping-city" type="text" placeholder="City" class="w-full px-4 py-3 rounded-xl border border-slate-200">
                <input id="shipping-state" type="text" placeholder="State" class="w-full px-4 py-3 rounded-xl border border-slate-200">
              </div>
              <input id="shipping-phone" type="text" placeholder="Phone Number" class="w-full px-4 py-3 rounded-xl border border-slate-200">
            </div>
          </div>

          <!-- Order Summary -->
          <div class="bg-white rounded-3xl p-6 shadow-sm mb-8">
            <h3 class="font-semibold text-lg mb-4">Order Summary</h3>
            <div id="payment-items" class="space-y-4"></div>
            <div class="border-t mt-6 pt-6">
              <div class="flex justify-between text-sm mb-2"><span>Subtotal</span><span id="summary-subtotal">₦0.00</span></div>
              <div class="flex justify-between text-xl font-bold mt-4 pt-4 border-t"><span>Total</span><span id="summary-total">₦0.00</span></div>
            </div>
          </div>

          <!-- Payment Methods -->
          <div class="bg-white rounded-3xl p-6 shadow-sm">
            <h3 class="font-semibold text-lg mb-5">Choose Payment Method</h3>
            <div class="grid grid-cols-2 gap-4 mb-8">
              <button onclick="selectPaymentMethod(this)" data-method="card" class="payment-method-btn flex flex-col items-center gap-3 p-6 border-2 rounded-2xl">
                <i data-lucide="credit-card" class="w-8 h-8 text-emerald-600"></i>
                <span class="font-medium">Card Payment</span>
              </button>
              <button onclick="selectPaymentMethod(this)" data-method="bank" class="payment-method-btn flex flex-col items-center gap-3 p-6 border-2 rounded-2xl">
                <i data-lucide="building-2" class="w-8 h-8 text-emerald-600"></i>
                <span class="font-medium">Bank Transfer</span>
              </button>
            </div>
            <div id="card-payment-form" class="hidden">
              <button onclick="payWithPaystack()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-4 rounded-2xl text-lg">
                Pay with Paystack
              </button>
            </div>
            <div id="bank-transfer-info" class="hidden text-center py-8">
              <p class="text-2xl font-bold mb-2">₦<span id="bank-amount">0</span></p>
              <p>Bank: GTBank | Account: JovA Marketplace | 1234567890</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/payment.js"></script>
  <script>
    function selectPaymentMethod(btn) {
      document.querySelectorAll('.payment-method-btn').forEach(b => {
        b.classList.remove('border-emerald-500', 'bg-emerald-50');
      });
      btn.classList.add('border-emerald-500', 'bg-emerald-50');
      const method = btn.getAttribute('data-method');
      document.getElementById('card-payment-form').classList.toggle('hidden', method !== 'card');
      document.getElementById('bank-transfer-info').classList.toggle('hidden', method !== 'bank');
    }
    lucide.createIcons();
  </script>
</body>
</html>
